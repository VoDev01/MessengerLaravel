<VirtualHost *:80>

	DocumentRoot /var/www/public
	<Directory /var/www/public>
		DirectoryIndex index.php
		AllowOverride all
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    RewriteEngine On
    RewriteRule "^/route1\.html$" "route2.html" [R=302]
	
</VirtualHost>

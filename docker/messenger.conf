<VirtualHost *:443>

	DocumentRoot /var/www/public
	<Directory /var/www/public>
		DirectoryIndex index.php
		AllowOverride all
		Require all granted
	</Directory>

	SSLEngine On
	SSLCertificateFile "/etc/apache2/cert/messenger.crt"
	SSLCertificateKey "/etc/apache2/cert/messenger.key"
	
</VirtualHost>
